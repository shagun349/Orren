services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: Orren-backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    volumes:
      - ./apps/backend/app:/app/app
    restart: unless-stopped
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: Orren-frontend
    ports:
      - "3000:3000"
    environment:
      - ./apps/frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
